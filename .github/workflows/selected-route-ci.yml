name: selected-route-ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  local-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run selected route local CI
        run: node scripts/ci-local.mjs --selected-route hybrid-native-cli-node-core
